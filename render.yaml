services:
  - type: web
    name: medicine-ecommerce-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: Backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx prisma migrate deploy && npm run seed:demo && npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: medicine-ecommerce-db
          property: connectionString
      - key: APP_URL
        fromService:
          type: web
          name: medicine-ecommerce-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: medicine-ecommerce-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: medicine-ecommerce-web
    runtime: node
    plan: free
    region: frankfurt
    rootDir: Frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_GOOGLE_AUTH_ENABLED
        value: "false"
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"
      - key: BACKEND_URL
        fromService:
          type: web
          name: medicine-ecommerce-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: API_URL
        fromService:
          type: web
          name: medicine-ecommerce-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: AUTH_URL
        fromService:
          type: web
          name: medicine-ecommerce-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: medicine-ecommerce-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        fromService:
          type: web
          name: medicine-ecommerce-web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: medicine-ecommerce-db
    databaseName: medistore
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
